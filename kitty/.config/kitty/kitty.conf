# theme
# include current-theme.conf

#fonts
font_family                  family="FiraCode Nerd Font Mono"
bold_font                    auto
italic_font                  auto
bold_italic_font             auto
font_size                    13

#Performance
input_delay                  0
repaint_delay                0
sync_to_monitor              no
wayland_enable_ime           no

#Background
background_opacity           0.85

#Options
cursor_blink_interval        0.5
cursor_stop_blinking_after   1
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 6
scrollback_lines             2000
wheel_scroll_min_lines       1
enable_audio_bell            no
hide_window_decorations      yes
background_opacity           0.9
dynamic_background_opacity   yes
confirm_os_window_close      0
linux_display_server         wayland
shell                        zsh
shell_integration            enabled
#tab style
tab_bar_edge                 top
tab_bar_style                powerline
tab_powerline_style          slanted
active_tab_font_style        bold
inactive_tab_font_style      italic

#opacity
map alt+p                    set_background_opacity -0.5
map alt+o                    set_background_opacity +0.5
map alt+Shift+o              set_background_opacity default
#reload config
map alt+r                    load_config_file
#window
map ctrl+shift+enter         new_window_with_cwd
map ctrl+shift+]             next_window
map ctrl+shift+[             previous_window
map ctrl+shift+w             close_window
#tab
map ctrl+shift+t             new_tab_with_cwd
map ctrl+shift+q             close_tab
map ctrl+]                   next_tab
map ctrl+[                   previous_tab


# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
