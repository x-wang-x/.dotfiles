# BEGIN_KITTY_THEME
# Carbonfox
include carbonfox.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# PERFORMANCE
input_delay 0
repaint_delay 0
sync_to_monitor no
wayland_enable_ime no

#Background
background_opacity 0.8
